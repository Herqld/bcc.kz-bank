name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications/ | grep -i xcode
          sudo xcode-select -s /Applications/Xcode.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode_15.5.app 2>/dev/null || true
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: mobile/ios/CODDY
        run: xcodegen generate

      - name: Verify generated project
        working-directory: mobile/ios/CODDY
        run: |
          ls -la bcc.kz-bank.xcodeproj/
          echo "=== Project contents ==="
          find bcc.kz-bank.xcodeproj -type f | head -20

      - name: Build for iOS Device (IPA)
        working-directory: mobile/ios/CODDY
        run: |
          echo "=== Starting xcodebuild ==="
          xcodebuild \
            -project bcc.kz-bank.xcodeproj \
            -scheme bcc.kz-bank \
            -configuration Release \
            -destination generic/platform=iOS \
            -derivedDataPath "$PWD/Build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Automatic \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee /tmp/xcodebuild.log

          BUILD_STATUS=${PIPESTATUS[0]}
          echo "=== xcodebuild exit code: $BUILD_STATUS ==="

          if [ $BUILD_STATUS -ne 0 ]; then
            echo "=== BUILD FAILED - Last 100 lines of output ==="
            tail -100 /tmp/xcodebuild.log
            exit 1
          fi

      - name: Find and package IPA
        working-directory: mobile/ios/CODDY
        run: |
          echo "=== Searching for .app in Build directory ==="
          find "$PWD/Build" -name "*.app" 2>/dev/null | head -10

          APP_PATH=$(find "$PWD/Build" -name "bcc.kz-bank.app" 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "bcc.kz-bank.app" -path "*/Build/Products/*" 2>/dev/null | head -1)
          fi
          echo "Found app at: $APP_PATH"
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/
            zip -r bcc.kz-bank.ipa Payload/
            ls -la bcc.kz-bank.ipa
            echo "✅ IPA created successfully"
          else
            echo "⚠️ App not found"
            exit 1
          fi

      - name: Upload IPA artifact
        if: success()
        working-directory: mobile/ios/CODDY
        uses: actions/upload-artifact@v4
        with:
          name: bcc.kz-bank-iOS-ipa
          path: bcc.kz-bank.ipa
          retention-days: 30

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: /tmp/xcodebuild.log
          retention-days: 7