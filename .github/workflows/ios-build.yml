name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Create Xcode project
        run: |
          cd mobile/ios/CODDY

          # Create project structure
          xcodebuild -create-xcframework -help 2>&1 | head -1 || true

          # Generate project using xcodeproj gem or xcodegen
          # We'll use a Swift script to create the project
          cat > create_project.swift << 'SWIFT_EOF'
          import Foundation

          let projectPath = "CODDY.xcodeproj"
          let sourceRoot = "CODDY"

          // Collect all Swift files
          let fileManager = FileManager.default
          var swiftFiles: [String] = []

          func collectSwiftFiles(in directory: String) {
              let fullPath = sourceRoot + "/" + directory
              if let enumerator = fileManager.enumerator(atPath: fullPath) {
                  for case let file as String in enumerator {
                      if file.hasSuffix(".swift") {
                          swiftFiles.append(directory + "/" + file)
                      }
                  }
              }
          }

          collectSwiftFiles(in: "CODDY")
          collectSwiftFiles(in: "CODDY/Models")
          collectSwiftFiles(in: "CODDY/Services")
          collectSwiftFiles(in: "CODDY/Utils")
          collectSwiftFiles(in: "CODDY/ViewModels")
          collectSwiftFiles(in: "CODDY/Views")

          print("Found \(swiftFiles.count) Swift files:")
          for f in swiftFiles { print("  \(f)") }

          // Write file list for xcodebuild
          let listPath = "Sources.xcfilelist"
          try swiftFiles.joined(separator: "\n").write(toFile: listPath, atomically: true, encoding: .utf8)
          print("Written \(listPath)")
          SWIFT_EOF
          swift create_project.swift

      - name: Create minimal Xcode project
        run: |
          cd mobile/ios/CODDY

          # Create project using xcodegen if available, otherwise generate manually
          cat > project.yml << 'YAML_EOF'
          name: CODDY
          options:
            bundleIdPrefix: kz.bcc
            deploymentTarget:
              iOS: "17.0"
            minimumXcodeGenVersion: 2.40.0
          settings:
            base:
              SWIFT_VERSION: "5.9"
              IPHONEOS_DEPLOYMENT_TARGET: "17.0"
              CODE_SIGN_STYLE: Automatic
              DEVELOPMENT_TEAM: ""
              ENABLE_PREVIEWS: "NO"
              SWIFT_EMIT_LOC_STRINGS: "YES"
          targets:
            CODDY:
              type: application
              platform: iOS
              sources:
                - path: CODDY
              resources:
                - CODDY/Info.plist
                - CODDY/LaunchScreen.storyboard
              settings:
                base:
                  INFOPLIST_FILE: CODDY/Info.plist
                  PRODUCT_BUNDLE_IDENTIFIER: kz.bcc.coddy
                  PRODUCT_NAME: CODDY
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
              dependencies: []
          schemes:
            CODDY:
              build:
                targets:
                  CODDY: all
              run:
                config: Debug
              test:
                config: Debug
          YAML_EOF

          # Try xcodegen, fallback to manual
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen generate
          else
            # Install xcodegen via homebrew
            brew install xcodegen
            xcodegen generate
          fi

      - name: Build for iOS Simulator
        run: |
          cd mobile/ios/CODDY
          xcodebuild \
            -project CODDY.xcodeproj \
            -scheme CODDY \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -quiet \
            clean build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build for iOS Device (IPA)
        run: |
          cd mobile/ios/CODDY

          # Create a development team placeholder for unsigned build
          # Note: For actual device install, you need a valid team
          xcodebuild \
            -project CODDY.xcodeproj \
            -scheme CODDY \
            -configuration Release \
            -destination generic/platform=iOS \
            -quiet \
            clean build \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            -allowProvisioningUpdates

      - name: Package IPA
        if: success()
        run: |
          cd mobile/ios/CODDY
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "CODDY.app" -path "*/Build/Products/Release-iphoneos/*" 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "CODDY.app" -path "*/Build/Products/Release/*" 2>/dev/null | head -1)
          fi
          echo "Found app at: $APP_PATH"

          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/
            zip -r CODDY.ipa Payload/
            ls -la CODDY.ipa
          else
            echo "⚠️ App not found, checking build products..."
            find ~/Library/Developer/Xcode/DerivedData -name "CODDY.app" 2>/dev/null | head -5
            exit 1
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CODDY-iOS-ipa
          path: mobile/ios/CODDY/CODDY.ipa
          retention-days: 30

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: ~/Library/Logs/DiagnosticReports/
          retention-days: 7