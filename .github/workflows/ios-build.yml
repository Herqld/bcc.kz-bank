name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: mobile/ios/CODDY
        run: xcodegen generate

      - name: Build for iOS Device (IPA)
        working-directory: mobile/ios/CODDY
        run: |
          xcodebuild \
            -project bcc.kz-bank.xcodeproj \
            -scheme bcc.kz-bank \
            -configuration Release \
            -destination generic/platform=iOS \
            clean build \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            -allowProvisioningUpdates

      - name: Find and package IPA
        run: |
          echo "=== Searching for .app in DerivedData ==="
          find ~/Library/Developer/Xcode/DerivedData -name "*.app" 2>/dev/null | grep -i bcc | head -10

          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "bcc.kz-bank.app" -path "*/Build/Products/Release-iphoneos/*" 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "bcc.kz-bank.app" -path "*/Build/Products/Release/*" 2>/dev/null | head -1)
          fi
          echo "Found app at: $APP_PATH"
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/
            zip -r bcc.kz-bank.ipa Payload/
            ls -la bcc.kz-bank.ipa
            echo "✅ IPA created successfully"
          else
            echo "⚠️ App not found, checking build products..."
            find ~/Library/Developer/Xcode/DerivedData -type d -name "Build" 2>/dev/null | head -5
            echo "=== DerivedData contents ==="
            ls -la ~/Library/Developer/Xcode/DerivedData/ 2>/dev/null || echo "Cannot list DerivedData"
            exit 1
          fi

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bcc.kz-bank-iOS-ipa
          path: bcc.kz-bank.ipa
          retention-days: 30

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: ~/Library/Logs/DiagnosticReports/
          retention-days: 7