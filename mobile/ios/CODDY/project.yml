name: CODDY
options:
  bundleIdPrefix: kz.bcc
  deploymentTarget:
    iOS: "17.0"
  minimumXcodeGenVersion: 2.40.0
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: "NO"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    PRODUCT_BUNDLE_IDENTIFIER: kz.bcc.coddy
    PRODUCT_NAME: CODDY
    INFOPLIST_FILE: CODDY/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: 1
    UI_SUPPORTED_INTERFACE_ORIENTATIONS: "UI.InterfaceOrientation.Portrait"
targets:
  CODDY:
    type: application
    platform: iOS
    sources:
      - path: CODDY
        excludes:
          - CODDY/AppIcon.swift
          - CODDY/CODDY.xcodeproj
    resources:
      - CODDY/Info.plist
      - CODDY/LaunchScreen.storyboard
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        ENABLE_BITCODE: "NO"
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        SWIFT_OPTIMIZATION_MODE: "wholemodule"
        SWIFT_COMPILATION_MODE: "wholemodule"
        ONLY_ACTIVE_ARCH: "YES"
        ARCHS: "arm64"
        VALID_ARCHS: "arm64"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    schemes:
      CODDY:
        build:
          targets:
            CODDY: all
        run:
          config: Debug
        test:
          config: Debug
        profile:
          config: Release
        analyze:
          config: Debug
        archive:
          config: Release